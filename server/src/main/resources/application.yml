spring:
  application:
    name: fintech-inter-ledger-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_lab}
    username: ${SPRING_DATASOURCE_USERNAME:ledger}
    password: ${SPRING_DATASOURCE_PASSWORD:ledger_dev_only}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# A integração é desligada por padrão para o server subir sem as credenciais.
# Quando chegar a hora de testar o sandbox, habilite-a por variáveis de ambiente.
inter:
  enabled: ${INTER_ENABLED:false}
  environment: ${INTER_ENVIRONMENT:SANDBOX}
  base-url: ${INTER_BASE_URL:https://cdpj-sandbox.partners.uatinter.co}
  token-path: ${INTER_TOKEN_PATH:/oauth/v2/token}
  client-id: ${INTER_CLIENT_ID:}
  client-secret: ${INTER_CLIENT_SECRET:}
  certificate-path: ${INTER_CERTIFICATE_PATH:}
  certificate-password: ${INTER_CERTIFICATE_PASSWORD:}
  account-id: ${INTER_ACCOUNT_ID:}
  # Primeiro passo do laboratório: leitura do extrato.
  scope: ${INTER_SCOPE:extrato.read}
