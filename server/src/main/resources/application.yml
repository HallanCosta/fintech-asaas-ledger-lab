spring:
  application:
    name: fintech-pix-lab-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_lab}
    username: ${SPRING_DATASOURCE_USERNAME:ledger}
    password: ${SPRING_DATASOURCE_PASSWORD:ledger_dev_only}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# A integração é desligada por padrão para o server subir sem a API key.
# Sandbox e produção usam chaves e URLs independentes no Asaas.
asaas:
  enabled: ${ASAAS_ENABLED:false}
  environment: ${ASAAS_ENVIRONMENT:SANDBOX}
  base-url: ${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
  api-key: ${ASAAS_API_KEY:}
  account-id: ${ASAAS_ACCOUNT_ID:}
  webhook-auth-token: ${ASAAS_WEBHOOK_AUTH_TOKEN:}
