name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --update-snapshots verify

  infrastructure:
    name: Validate local infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dummy production env
        run: |
          printf '%s\n' \
            'ASAAS_ENABLED=false' \
            'ASAAS_INTERNAL_API_KEY=ci-only-not-a-secret' > server/.env.production

      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml --env-file server/.env.production config --quiet

      - name: Build server and web images
        run: docker compose -f docker-compose.prod.yml --env-file server/.env.production build
